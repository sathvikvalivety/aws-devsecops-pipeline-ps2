apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sathvik-payment-network-policy
  namespace: sathvik-workloads
spec:
  podSelector:
    matchLabels:
      app: sathvik-payment-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow internal traffic on port 8000 only from internal API gateway / auth proxy
  - from:
    - podSelector:
        matchLabels:
          tier: api-gateway
    ports:
    - protocol: TCP
      port: 8000
  egress:
  # Allow DNS resolution
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow HTTPS only to AWS VPC endpoints / Secrets Manager
  - ports:
    - protocol: TCP
      port: 443
